<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shubham Gaming</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080817;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            background: #12122e;
            padding: 25px 10px;
            border-bottom: 2px solid #00ffff;
        }

        h1 {
            color: #00ffff;
            font-size: 32px;
            text-shadow: 0 0 10px #00ffff;
        }

        .game-card {
            background: #171735;
            width: 320px;
            max-width: 90%;
            margin: 35px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px #00ffff;
        }

        .game-card img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        h2 {
            color: #ff00ff;
        }

        button {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ff00ff;
            color: white;
        }

        footer {
            color: #aaa;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎮 SHUBHAM GAMING 🎮</h1>
        <p>Welcome to My Gaming World!</p>
    </header>

    <div class="game-card">

        <h2>🕹️ My First Game</h2>

        <img src="game.jpg" alt="Gaming Photo">

        <p>Ready to Play?</p>

        <button onclick="playGame()">PLAY GAME</button>

    </div>

    <footer>
        © 2026 Shubham Gaming
    </footer>

    <script>
        function playGame() {
            alert("🎮 Game Starting!");
        }
    </script>

</body>
</html>
